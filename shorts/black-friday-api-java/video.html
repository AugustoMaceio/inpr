<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Java na Black Friday</title>
<!--
  Short vertical 9:16 (60 s): API REST com Java aguentando a Black Friday.
  Conceitos: DNS, TCP, latência, cache e filas.
  Arquivo autocontido: HTML + CSS + JavaScript puro, sem bibliotecas e sem imagens externas.
  Para editar textos e tempos, altere o array CENAS (mais abaixo).
-->
<style>
  :root { --bg:#0F172A; --painel:#1E293B; --texto:#E2E8F0; --azul:#38BDF8; }
  * { box-sizing: border-box; }
  body { margin:0; background:#020617; color:var(--texto); font-family:system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  #palco { height:calc(100vh - 76px); aspect-ratio:9/16; max-width:100vw; margin-top:8px;
           background:var(--bg); border-radius:12px; box-shadow:0 0 40px #0008; }
  #controles { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:10px 16px; }
  button { background:var(--painel); color:var(--texto); border:1px solid #334155; border-radius:8px;
           padding:8px 14px; font-size:15px; cursor:pointer; }
  button:hover { border-color:var(--azul); }
  #status { font-size:13px; color:#94A3B8; align-self:center; }
</style>
</head>
<body>
<canvas id="palco" width="1080" height="1920"></canvas>
<div id="controles">
  <button id="btnPlay">▶ Reproduzir</button>
  <button id="btnPausa">⏸ Pausar</button>
  <button id="btnReiniciar">⟲ Reiniciar</button>
  <button id="btnVoz">🔊 Narração: ligada</button>
  <button id="btnGravar">⏺ Gravar vídeo (.webm)</button>
  <span id="status"></span>
</div>

<script>
// ===================== CONFIGURAÇÃO =====================
const W = 1080, H = 1920;
const COR = {
  fundo:'#0F172A', painel:'#1E293B', linha:'#334155', texto:'#E2E8F0', apagado:'#64748B',
  azul:'#38BDF8', vermelho:'#EF4444', verde:'#22C55E', laranja:'#F59E0B', amarelo:'#FACC15'
};
const MONO = 'ui-monospace, "JetBrains Mono", Consolas, monospace';
const SANS = 'system-ui, "Segoe UI", Roboto, sans-serif';

const canvas = document.getElementById('palco');
const ctx = canvas.getContext('2d');

// ===================== FUNÇÕES AUXILIARES =====================
const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - clamp(p), 3);
const easeInOut = p => { p = clamp(p); return p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2; };
const faixa = (t, a, b) => clamp((t - a) / (b - a));          // progresso 0..1 entre a e b
const misturar = (c1, c2, p) => {                              // mistura duas cores hex
  const h = c => [1,3,5].map(i => parseInt(c.slice(i, i+2), 16));
  const [a, b] = [h(c1), h(c2)];
  return 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], clamp(p)))).join(',') + ')';
};
// números pseudoaleatórios fixos (a animação é sempre igual, bom para gravar)
let semente = 7;
const aleatorio = () => (semente = (semente * 16807) % 2147483647) / 2147483647;

function retangulo(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function texto(t, x, y, { tam=40, cor=COR.texto, alinhar='center', peso='600', fonte=SANS, alfa=1 } = {}) {
  ctx.save(); ctx.globalAlpha *= alfa;
  ctx.font = `${peso} ${tam}px ${fonte}`; ctx.fillStyle = cor;
  ctx.textAlign = alinhar; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y); ctx.restore();
}

// Caixa de componente (API, DNS, Cache...) centralizada em (x, y)
function caixa(x, y, w, h, { cor=COR.azul, titulo='', sub='', alfa=1, escala=1, tremor=0, brilho=0 } = {}) {
  ctx.save(); ctx.globalAlpha *= alfa;
  ctx.translate(x + (tremor ? Math.sin(performance.now() / 25) * tremor : 0), y);
  ctx.scale(escala, escala);
  if (brilho) { ctx.shadowColor = cor; ctx.shadowBlur = 50 * brilho; }
  retangulo(-w/2, -h/2, w, h, 28);
  ctx.fillStyle = COR.painel; ctx.fill();
  ctx.shadowBlur = 0; ctx.lineWidth = 6; ctx.strokeStyle = cor; ctx.stroke();
  texto(titulo, 0, sub ? -18 : 0, { tam: 46, cor, peso: '800' });
  if (sub) texto(sub, 0, 34, { tam: 28, cor: COR.texto, peso: '500' });
  ctx.restore();
}

// Banco de dados (cilindro)
function cilindro(x, y, w, h, { cor=COR.azul, titulo='Banco de Dados', tremor=0, alfa=1 } = {}) {
  ctx.save(); ctx.globalAlpha *= alfa;
  ctx.translate(x + (tremor ? Math.sin(performance.now() / 20) * tremor : 0), y);
  const ry = 34;
  ctx.fillStyle = COR.painel; ctx.strokeStyle = cor; ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.ellipse(0, -h/2, w/2, ry, 0, Math.PI, 0);
  ctx.lineTo(w/2, h/2); ctx.ellipse(0, h/2, w/2, ry, 0, 0, Math.PI); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -h/2, w/2, ry, 0, 0, Math.PI*2); ctx.stroke();
  texto(titulo, 0, 16, { tam: 34, cor, peso: '800' });
  ctx.restore();
}

// Celular
function celular(x, y, { cor=COR.azul, tela='', alfa=1 } = {}) {
  ctx.save(); ctx.globalAlpha *= alfa; ctx.translate(x, y);
  retangulo(-75, -130, 150, 260, 26); ctx.fillStyle = COR.painel; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = cor; ctx.stroke();
  retangulo(-25, -115, 50, 10, 5); ctx.fillStyle = cor; ctx.fill();
  if (tela) texto(tela, 0, 0, { tam: 26, cor: COR.texto, peso: '700' });
  ctx.restore();
}

// Seta que se desenha (p = 0..1)
function seta(x1, y1, x2, y2, p, cor=COR.azul, larg=6) {
  p = clamp(p); if (p <= 0) return;
  const xe = lerp(x1, x2, p), ye = lerp(y1, y2, p), ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); ctx.strokeStyle = cor; ctx.fillStyle = cor; ctx.lineWidth = larg; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(xe, ye); ctx.stroke();
  ctx.translate(xe, ye); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-22, -14); ctx.lineTo(-22, 14); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function pacote(x, y, cor=COR.azul, r=14) {
  ctx.save(); ctx.shadowColor = cor; ctx.shadowBlur = 24;
  ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.restore();
}

// Etiqueta arredondada (pílula) com texto
function etiqueta(t, x, y, { cor=COR.azul, tam=34, fundo=COR.painel, fonte=SANS, alfa=1 } = {}) {
  ctx.save(); ctx.globalAlpha *= alfa;
  ctx.font = `700 ${tam}px ${fonte}`;
  const w = ctx.measureText(t).width + tam * 1.2, h = tam * 1.7;
  retangulo(x - w/2, y - h/2, w, h, h/2); ctx.fillStyle = fundo; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = cor; ctx.stroke();
  texto(t, x, y + 1, { tam, cor, peso: '700', fonte });
  ctx.restore();
}

// Envelope numerado
function envelope(x, y, n, cor=COR.azul, esc=1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(esc, esc);
  retangulo(-40, -28, 80, 56, 8); ctx.fillStyle = COR.painel; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = cor; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-40, -28); ctx.lineTo(0, 4); ctx.lineTo(40, -28); ctx.stroke();
  if (n !== undefined) texto(String(n), 0, 12, { tam: 24, cor, peso: '800' });
  ctx.restore();
}

// Cronômetro com ponteiro
function cronometro(x, y, r, ms, cor) {
  ctx.save(); ctx.translate(x, y);
  ctx.lineWidth = 8; ctx.strokeStyle = cor; ctx.fillStyle = COR.painel;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = cor; ctx.fillRect(-14, -r - 26, 28, 18);
  const ang = -Math.PI/2 + (ms / 2000) * Math.PI * 2;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ang) * r * .75, Math.sin(ang) * r * .75); ctx.stroke();
  ctx.restore();
  texto(Math.round(ms).toLocaleString('pt-BR') + ' ms', x, y + r + 50, { tam: 48, cor, peso: '800', fonte: MONO });
}

// Título grande no topo de cada cena
function titulo(t, cor=COR.texto, alfa=1, tam=78) {
  texto(t, W/2, 250, { tam, cor, peso: '900', alfa });
}

// Posição ao longo de uma linha poligonal (u = distância percorrida)
function aoLongo(pontos, u) {
  for (let i = 0; i < pontos.length - 1; i++) {
    const [a, b] = [pontos[i], pontos[i+1]];
    const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (u <= d) return [lerp(a[0], b[0], u / d), lerp(a[1], b[1], u / d)];
    u -= d;
  }
  return null; // já chegou ao fim
}
const comprimento = pts => pts.slice(1).reduce((s, b, i) => s + Math.hypot(b[0] - pts[i][0], b[1] - pts[i][1]), 0);

// Partículas fixas da cena 1
const PARTICULAS = Array.from({ length: 70 }, (_, i) => ({
  x: aleatorio() * W, atraso: 0.5 + i * 0.03 + aleatorio() * 0.2, dx: (aleatorio() - .5) * 220, dy: (aleatorio() - .5) * 120
}));

// ===================== CENAS (siga o storyboard) =====================
// inicio/duracao em segundos; destaques = palavras-chave pintadas de amarelo na legenda
const CENAS = [
  { // 1. GANCHO
    inicio: 0, duracao: 4,
    narracao: 'Meia-noite, Black Friday. Dez mil cliques em comprar. Sua API Java caiu.',
    destaques: ['dez', 'mil', 'caiu.'],
    desenhar(t) {
      const virou = t > 0.5;
      texto(virou ? '00:00:00' : '23:59:59', W/2, 420, { tam: 96, cor: virou ? COR.vermelho : COR.texto, peso: '800', fonte: MONO });
      const caiu = faixa(t, 2.2, 2.6);
      PARTICULAS.forEach(p => {
        const q = faixa(t, p.atraso, p.atraso + 0.8);
        if (q > 0 && q < 1) pacote(lerp(p.x, W/2 + p.dx, easeInOut(q)), lerp(560, 1050 + p.dy, easeInOut(q)), COR.azul, 11);
      });
      caixa(W/2, 1050, 460, 240, {
        cor: misturar(COR.azul, COR.vermelho, caiu), titulo: 'API Java', sub: caiu ? 'fora do ar' : 'Spring Boot',
        tremor: caiu ? 10 : 0, brilho: caiu
      });
      if (caiu > 0) { // rachadura
        ctx.save(); ctx.globalAlpha = caiu; ctx.strokeStyle = COR.vermelho; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(500, 930); ctx.lineTo(560, 1000); ctx.lineTo(520, 1060); ctx.lineTo(580, 1170); ctx.stroke();
        ctx.restore();
        etiqueta('503 Service Unavailable', W/2, 1300, { cor: COR.vermelho, tam: 44, fonte: MONO, alfa: caiu });
      }
      titulo('10.000 req/s', COR.vermelho, faixa(t, 0.6, 1));
    }
  },
  { // 2. PROBLEMA
    inicio: 4, duracao: 7,
    narracao: 'O cliente só quer ver o preço e pagar. Mas o banco de dados não aguenta dez mil pedidos por segundo.',
    destaques: ['banco', 'dados'],
    desenhar(t) {
      titulo('Banco sobrecarregado', COR.vermelho, faixa(t, 2.5, 3.2));
      celular(200, 620, { tela: 'R$ 99,90', alfa: faixa(t, 0, .4) });
      seta(290, 620, 380, 620, faixa(t, .4, .9));
      caixa(600, 620, 400, 200, { titulo: 'API Java', sub: 'GET /produtos/42', cor: COR.laranja });
      const carga = faixa(t, 1.5, 5.5);
      // fila de requisições acumulando entre a API e o banco
      const n = Math.floor(carga * 14);
      for (let i = 0; i < n; i++) pacote(600 + ((i % 2) ? 26 : -26), 1180 - i * 26, misturar(COR.azul, COR.vermelho, carga), 12);
      cilindro(600, 1320, 380, 170, { cor: misturar(COR.azul, COR.vermelho, carga), tremor: carga * 9 });
      etiqueta('CPU 100%', 870, 1460, { cor: COR.vermelho, alfa: faixa(t, 3.5, 4) });
    }
  },
  { // 3. TENTATIVA INGÊNUA
    inicio: 11, duracao: 4,
    narracao: 'Aumentar a memória do servidor? O gargalo continua no banco.',
    destaques: ['gargalo'],
    desenhar(t) {
      titulo('Mais RAM ≠ solução', COR.vermelho, faixa(t, 0, .4));
      const cresce = easeOut(faixa(t, .3, 1.5));
      caixa(W/2, 650, 400, 200, { titulo: 'API Java', sub: cresce > .5 ? 'RAM: 64 GB' : 'RAM: 8 GB', escala: 1 + cresce * .35, cor: COR.azul });
      // funil entupido
      ctx.save(); ctx.strokeStyle = COR.vermelho; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(330, 860); ctx.lineTo(500, 1110); ctx.moveTo(750, 860); ctx.lineTo(580, 1110); ctx.stroke(); ctx.restore();
      for (let i = 0; i < 18; i++) {
        const col = i % 6, lin = Math.floor(i / 6);
        pacote(390 + col * 60 - lin * 0, 900 + lin * 60 + Math.sin(t * 8 + i) * 3, COR.vermelho, 12);
      }
      cilindro(540, 1260, 360, 160, { cor: COR.vermelho, tremor: 7 });
      const x = faixa(t, 2.4, 2.8);
      if (x > 0) {
        ctx.save(); ctx.globalAlpha = x; ctx.strokeStyle = COR.vermelho; ctx.lineWidth = 18; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(820, 940); ctx.lineTo(960, 1080); ctx.moveTo(960, 940); ctx.lineTo(820, 1080); ctx.stroke();
        ctx.restore();
      }
    }
  },
  { // 4. PASSO 1A — DNS
    inicio: 15, duracao: 5,
    narracao: 'Primeiro, o celular traduz loja.com em um endereço IP. Isso é o DNS.',
    destaques: ['dns.', 'ip.'],
    desenhar(t) {
      texto('PASSO 1', W/2, 150, { tam: 36, cor: COR.azul, peso: '800' });
      titulo(t > 3.4 ? 'DNS' : 'loja.com → ?', t > 3.4 ? COR.azul : COR.texto, 1, t > 3.4 ? 110 : 78);
      celular(230, 1150, { tela: 'loja.com' });
      caixa(790, 700, 400, 220, { titulo: 'DNS', sub: 'lista telefônica da internet', cor: COR.azul, alfa: faixa(t, 0, .5) });
      // linhas de "lista telefônica"
      const ida = faixa(t, .6, 1.8), volta = faixa(t, 2, 3.2);
      seta(300, 1010, 650, 830, ida, COR.azul);
      if (ida > 0 && ida < 1) etiqueta('loja.com', lerp(300, 650, ida), lerp(1010, 830, ida) - 60, { tam: 30, fonte: MONO });
      seta(720, 830, 380, 1030, volta, COR.verde);
      if (volta > 0) etiqueta('203.0.113.10', lerp(720, 380, volta) + 60, lerp(830, 1030, volta) + 60, { tam: 30, cor: COR.verde, fonte: MONO });
      if (t > 3.4) etiqueta('nome → endereço IP', W/2, 1420, { cor: COR.azul, tam: 40 });
    }
  },
  { // 5. PASSO 1B — TCP
    inicio: 20, duracao: 5,
    narracao: 'Depois, abre uma conexão confiável com a API Java. Isso é o TCP.',
    destaques: ['tcp.', 'confiável'],
    desenhar(t) {
      texto('PASSO 1', W/2, 150, { tam: 36, cor: COR.azul, peso: '800' });
      titulo(t > 3.3 ? 'TCP · conexão confiável' : 'Aperto de mão…', t > 3.3 ? COR.azul : COR.texto, 1, t > 3.3 ? 70 : 78);
      celular(190, 900, { tela: '203.0.113.10' });
      caixa(820, 900, 340, 220, { titulo: 'API Java', sub: 'porta 443' });
      const passos = [['SYN', 1], ['SYN-ACK', -1], ['ACK', 1]];
      passos.forEach(([nome, dir], i) => {
        const p = faixa(t, .3 + i * .6, .8 + i * .6), y = 720 + i * 90;
        if (dir > 0) seta(280, y, 640, y, p, COR.azul, 5); else seta(640, y, 280, y, p, COR.verde, 5);
        if (p > 0) texto(nome, 460, y - 30, { tam: 28, cor: dir > 0 ? COR.azul : COR.verde, fonte: MONO, alfa: p });
      });
      // envelopes numerados com confirmação de recebimento
      for (let i = 0; i < 3; i++) {
        const p = easeInOut(faixa(t, 2.2 + i * .35, 3.2 + i * .35));
        if (p > 0) envelope(lerp(280, 640, p), 1130 + i * 90, i + 1, COR.azul, .9);
        if (p >= 1) texto('✓ recebido', 760, 1130 + i * 90, { tam: 30, cor: COR.verde, alinhar: 'left' });
      }
      if (t > 3.3) etiqueta('pacotes chegam inteiros e em ordem', W/2, 1450, { cor: COR.azul, tam: 34 });
    }
  },
  { // 6. PASSO 2 — LATÊNCIA
    inicio: 25, duracao: 7,
    narracao: 'A API consulta o banco lotado. A resposta leva dois segundos. Essa espera é a latência.',
    destaques: ['latência.', 'dois', 'segundos.'],
    desenhar(t) {
      texto('PASSO 2', W/2, 150, { tam: 36, cor: COR.vermelho, peso: '800' });
      titulo(t > 4.6 ? 'LATÊNCIA: 2.000 ms' : 'Esperando…', COR.vermelho, 1, 76);
      caixa(380, 620, 380, 200, { titulo: 'API Java', sub: 'SELECT … produtos' });
      cilindro(380, 1220, 360, 170, { cor: COR.vermelho, tremor: 4 });
      const ida = easeInOut(faixa(t, .3, 2.2)), volta = easeInOut(faixa(t, 3.2, 4.4));
      if (ida > 0 && ida < 1) pacote(380, lerp(730, 1110, ida), COR.azul, 18);
      if (ida >= 1 && volta === 0) pacote(380 + Math.sin(t * 12) * 6, 1110, COR.laranja, 18);
      if (volta > 0 && volta < 1) pacote(380, lerp(1110, 730, volta), COR.azul, 18);
      const ms = 2000 * faixa(t, .3, 4.4);
      cronometro(820, 900, 120, ms, misturar(COR.laranja, COR.vermelho, ms / 2000));
      if (t > 5.2) texto('latência = atraso (não é velocidade da internet)', W/2, 1460, { tam: 32, cor: COR.texto, peso: '500', alfa: faixa(t, 5.2, 5.7) });
    }
  },
  { // 7. PASSO 3 — CACHE
    inicio: 32, duracao: 10,
    narracao: 'Para consultas repetidas, guardamos a resposta numa memória rápida: o cache. No Spring, basta a anotação Cacheable. A resposta cai para dez milissegundos.',
    destaques: ['cache.', 'cacheable', 'dez', 'milissegundos.'],
    desenhar(t) {
      texto('PASSO 3', W/2, 150, { tam: 36, cor: COR.verde, peso: '800' });
      titulo(t > 3 ? 'CACHE' : 'Memória rápida…', t > 3 ? COR.verde : COR.texto, 1, t > 3 ? 110 : 78);
      caixa(380, 470, 360, 180, { titulo: 'API Java' });
      const surge = easeOut(faixa(t, .3, 1.2));
      caixa(380, lerp(900, 770, surge), 360, 170, { titulo: 'Cache', sub: 'Redis · memória', cor: COR.verde, alfa: surge, brilho: surge * .6 });
      cilindro(380, 1090, 320, 140, { cor: COR.apagado, alfa: .8 });
      // 1ª consulta: passa pelo cache (miss), vai ao banco e volta devagar
      const miss = faixa(t, 1.4, 3.6);
      if (miss > 0 && miss < 1) {
        const y = miss < .5 ? lerp(560, 1020, miss * 2) : lerp(1020, 560, (miss - .5) * 2);
        pacote(380, y, COR.laranja, 16);
      }
      // consultas seguintes: batem no cache e voltam na hora
      for (let i = 0; i < 6; i++) {
        const p = faixa(t, 6.2 + i * .45, 6.6 + i * .45);
        if (p > 0 && p < 1) pacote(380, p < .5 ? lerp(560, 690, p * 2) : lerp(690, 560, (p - .5) * 2), COR.verde, 16);
      }
      const rapido = t > 6.4;
      etiqueta(rapido ? '10 ms' : (miss > 0 ? '2.000 ms' : '—'), 820, 470, { cor: rapido ? COR.verde : COR.vermelho, tam: 50, fonte: MONO });
      if (miss > .9 && !rapido) texto('1ª vez: busca no banco e guarda', 820, 570, { tam: 26, cor: COR.texto, peso: '500' });
      if (rapido) texto('próximas: direto do cache', 820, 570, { tam: 26, cor: COR.verde, peso: '600' });
      // código Java
      const cod = faixa(t, 4.2, 4.8);
      if (cod > 0) {
        ctx.save(); ctx.globalAlpha = cod;
        retangulo(70, 1230, 940, 240, 20); ctx.fillStyle = '#020617'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = COR.laranja; ctx.stroke();
        const linhas = [
          ['@Cacheable("produtos")', COR.laranja],
          ['public Produto buscar(Long id) {', COR.texto],
          ['  return repo.findById(id).orElseThrow();', COR.texto],
          ['}', COR.texto]
        ];
        linhas.forEach(([l, c], i) => texto(l, 110, 1285 + i * 46, { tam: 32, cor: c, alinhar: 'left', fonte: MONO, peso: i ? '500' : '800' }));
        ctx.restore();
      }
    }
  },
  { // 8. PASSO 4 — FILA
    inicio: 42, duracao: 9,
    narracao: 'E na hora de pagar? A API põe o pedido numa fila e responde na hora. O banco processa no ritmo que aguenta.',
    destaques: ['fila', 'pagar?'],

      celular(170, 560, { tela: 'Pagar' });
      caixa(640, 560, 360, 180, { titulo: 'API Java', sub: 'POST /pedidos' });
      const resp = faixa(t, 1.4, 2.2);
      seta(440, 600, 270, 600, resp, COR.verde, 5);
      if (resp > 0) etiqueta('202 Accepted', 300, 760, { cor: COR.verde, tam: 34, fonte: MONO, alfa: resp });
      // esteira (fila)
      ctx.save(); ctx.strokeStyle = COR.verde; ctx.lineWidth = 5;
      retangulo(120, 920, 840, 120, 60); ctx.stroke();
      for (let i = 0; i < 14; i++) { const x = 150 + ((i * 60 + t * 80) % 780); ctx.beginPath(); ctx.moveTo(x, 1020); ctx.lineTo(x + 20, 1020); ctx.stroke(); }
      ctx.restore();
      texto('Fila (RabbitMQ / Kafka)', 540, 1085, { tam: 30, cor: COR.verde, peso: '700' });
      caixa(840, 1240, 300, 150, { titulo: 'Worker', sub: 'consumidor', cor: COR.verde });
      cilindro(400, 1260, 300, 130, { cor: COR.verde });
      seta(690, 1250, 570, 1250, 1, COR.verde, 5);
      // pedidos entram na fila e saem no ritmo do consumidor
      const caminho = [[640, 650], [200, 980], [880, 980], [880, 1160]];
      const L = comprimento(caminho);
      let processados = 0;
      for (let i = 0; i < 12; i++) {
        const u = (t - (.8 + i * .55)) * 360;
        if (u < 0) continue;
        const pos = aoLongo(caminho, u);
        if (pos) envelope(pos[0], pos[1], i + 1, COR.verde, .75); else processados++;
      }

  },
  { // 9. RESULTADO E RECAPITULAÇÃO
    inicio: 51, duracao: 6,

        if (i < 3) seta(W/2, y + 85, W/2, y + 130, 1, COR.apagado, 4);

    inicio: 57, duracao: 3,

const DURACAO = 60;

// ===================== LEGENDA =====================
function legenda(cena) {
  const palavras = cena.narracao.split(' ');
  const tam = 42, maxW = 920, lh = 58;
  ctx.font = `700 ${tam}px ${SANS}`;
  const linhas = [[]]; let largura = 0;
  palavras.forEach(p => {
    const w = ctx.measureText(p + ' ').width;
    if (largura + w > maxW && linhas[linhas.length - 1].length) { linhas.push([]); largura = 0; }
    linhas[linhas.length - 1].push(p); largura += w;
  });
  const topo = 1560, altura = linhas.length * lh + 50;
  ctx.save(); ctx.globalAlpha = .85; retangulo(50, topo, W - 100, altura, 24); ctx.fillStyle = '#020617'; ctx.fill(); ctx.restore();
  linhas.forEach((linha, i) => {
    const total = ctx.measureText(linha.join(' ')).width;
    let x = W/2 - total/2;
    linha.forEach(p => {
      const chave = cena.destaques.includes(p.toLowerCase());
      ctx.font = `700 ${tam}px ${SANS}`; ctx.fillStyle = chave ? COR.amarelo : COR.texto;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(p, x, topo + 25 + lh/2 + i * lh);
      x += ctx.measureText(p + ' ').width;
    });
  });
}

// ===================== DESENHO DE UM QUADRO =====================
function cenaEm(t) { return CENAS.find(c => t >= c.inicio && t < c.inicio + c.duracao) || CENAS[CENAS.length - 1]; }

function desenharQuadro(t) {
  ctx.fillStyle = COR.fundo; ctx.fillRect(0, 0, W, H);
  // grade sutil de fundo
  ctx.save(); ctx.strokeStyle = '#1E293B'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  texto('API REST · Black Friday', W/2, 70, { tam: 30, cor: COR.apagado, peso: '700' });
  const cena = cenaEm(t), local = t - cena.inicio;
  const entrada = faixa(local, 0, .25);                     // transição curta entre cenas
  ctx.save(); ctx.globalAlpha = entrada; ctx.translate(0, (1 - easeOut(entrada)) * 40);
  cena.desenhar(local);
  ctx.restore();
  legenda(cena);
  // barra de progresso
  ctx.fillStyle = COR.linha; ctx.fillRect(0, H - 14, W, 14);
  ctx.fillStyle = COR.azul; ctx.fillRect(0, H - 14, W * clamp(t / DURACAO), 14);
}
window.renderAt = desenharQuadro; // útil para gerar quadros de teste

// ===================== NARRAÇÃO (Web Speech API) =====================
let vozLigada = 'speechSynthesis' in window;
let vozPt = null;
function escolherVoz() {
  if (!('speechSynthesis' in window)) return;
  const vozes = speechSynthesis.getVoices();
  vozPt = vozes.find(v => v.lang === 'pt-BR') || vozes.find(v => v.lang.startsWith('pt')) || null;
}
if ('speechSynthesis' in window) { escolherVoz(); speechSynthesis.onvoiceschanged = escolherVoz; }
function falar(txt) {
  if (!vozLigada) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt.replace('Cacheable', 'arroba Cacheable'));
  u.lang = 'pt-BR'; u.rate = 1.1; if (vozPt) u.voice = vozPt;
  speechSynthesis.speak(u);
}

// ===================== LINHA DO TEMPO =====================
let tempo = 0, tocando = false, ultimo = 0, cenaAtual = null, aoTerminar = null;
function laco(agora) {
  if (tocando) {
    tempo += (agora - ultimo) / 1000; ultimo = agora;
    if (tempo >= DURACAO) { tempo = DURACAO - 0.001; tocando = false; if (aoTerminar) { aoTerminar(); aoTerminar = null; } }
    const c = cenaEm(tempo);
    if (c !== cenaAtual) { cenaAtual = c; falar(c.narracao); }
  }
  desenharQuadro(tempo);
  requestAnimationFrame(laco);
}
function tocar() { if (tempo >= DURACAO - 0.01) reiniciar(); tocando = true; ultimo = performance.now(); if ('speechSynthesis' in window) speechSynthesis.resume(); }
function pausar() { tocando = false; if ('speechSynthesis' in window) speechSynthesis.pause(); }
function reiniciar() { tempo = 0; cenaAtual = null; if ('speechSynthesis' in window) speechSynthesis.cancel(); }

document.getElementById('btnPlay').onclick = tocar;
document.getElementById('btnPausa').onclick = pausar;
document.getElementById('btnReiniciar').onclick = () => { reiniciar(); tocar(); };
document.getElementById('btnVoz').onclick = e => {
  vozLigada = !vozLigada && 'speechSynthesis' in window;
  if (!vozLigada && 'speechSynthesis' in window) speechSynthesis.cancel();
  e.target.textContent = '🔊 Narração: ' + (vozLigada ? 'ligada' : 'desligada');
};
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); tocando ? pausar() : tocar(); } });

// ===================== GRAVAÇÃO EM .WEBM =====================
// Grava só a imagem do canvas. A voz do navegador não entra no arquivo:
// para gravar com som, use a gravação de tela do sistema (Win+Alt+R / Cmd+Shift+5).
document.getElementById('btnGravar').onclick = () => {
  const status = document.getElementById('status');
  if (!canvas.captureStream || !window.MediaRecorder) { status.textContent = 'Navegador sem suporte a gravação.'; return; }
  const tipo = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const gravador = new MediaRecorder(canvas.captureStream(30), { mimeType: tipo, videoBitsPerSecond: 8e6 });
  const partes = [];
  gravador.ondataavailable = e => e.data.size && partes.push(e.data);
  gravador.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(partes, { type: 'video/webm' }));
    a.download = 'api-java-black-friday.webm'; a.click();
    status.textContent = 'Vídeo salvo.';
  };
  reiniciar(); gravador.start(); status.textContent = 'Gravando… (60 s)';
  aoTerminar = () => gravador.stop();
  tocar();
};

requestAnimationFrame(laco);
